name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: songfest_test
          POSTGRES_USER: songfest_test
          POSTGRES_PASSWORD: songfest-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songfest_test -d songfest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://songfest_test:songfest-test-password@127.0.0.1:5432/songfest_test
      NODE_ENV: test
      LOG_LEVEL: silent
      WEB_ORIGIN: http://127.0.0.1:5173
      SESSION_SECRET: songfest-ci-session-secret-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ./node_modules/.bin/prisma migrate deploy
      - run: npm run test:integration --workspace @songfest/api
